name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and drift gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    # Without this, each `uv run` re-syncs the default groups and installs torch after all.
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (dev group only; no torch)
        run: uv sync --locked --no-default-groups --group dev
      # The figure and filter fixture tests render small pages; tests/conftest.py fails
      # them in CI instead of skipping when quarto is missing.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.19
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Validate _variables.yml
        run: uv run python scripts/variables.py
      - name: Tests (prl, generators, notebook build, records, pages)
        run: uv run pytest

  colab-compat:
    name: Our pins install on Colab's packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: CPU runtime freeze
        run: uv run --no-project --with pyyaml python scripts/colab_constraints.py compat --runtime cpu
      - name: GPU runtime freeze
        run: uv run --no-project --with pyyaml python scripts/colab_constraints.py compat --runtime gpu

  infra:
    name: Lint infra/aws (cfn-lint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: bash infra/aws/lint.sh

  notebooks:
    name: List notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "matrix=$(cd notebooks && printf '%s\n' *.ipynb | sed 's/\.ipynb$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  colab-sim:
    name: Notebook ${{ matrix.notebook }} (Colab-like, QUICK)
    needs: [test, notebooks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJson(needs.notebooks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Colab-like environment from the pinned freeze, then worked, learner and verify modes
      # (PRL_QUICK=1). The steps live in the composite action so health.yml runs the same ones.
      - uses: ./.github/actions/colab-sim
        with:
          notebook: ${{ matrix.notebook }}
