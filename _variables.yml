# Single source of truth for the workshop. Pages read it through {{< var ... >}};
# scripts/gen_includes.py and scripts/build_notebooks.py generate from it.
# Validated by scripts/variables.py (pytest: tests/test_variables.py). American English.

repo:
  owner: project-delphi
  name: practical-rl
  branch: main
  url: https://github.com/project-delphi/practical-rl
  site_url: https://project-delphi.github.io/practical-rl
  colab_base: https://colab.research.google.com/github/project-delphi/practical-rl/blob/main/notebooks
  raw_base: https://github.com/project-delphi/practical-rl/raw/main/notebooks

prl:
  ref: main          # a tag at release (release check enforces it)
  version: 0.1.0.dev0
  api: 1

workshop:
  title: Practical Reinforcement Learning
  subtitle: A five-day, first-principles, hands-on workshop
  org: Genial Labs
  days: 5
  license_text: CC BY 4.0
  license_code: MIT

# The daily clock. Every day uses it; module slots A, B and C fill the module blocks.
clock:
  blocks:
    - {start: "08:00", end: "09:00", kind: clinic, days: [1], label: "Optional setup clinic"}
    - {start: "09:00", end: "09:15", kind: warmup, label: "Warm-up"}
    - {start: "09:15", end: "11:15", kind: module, slot: A, parts: [[briefing, 40], [lab, 70], [debrief, 10]]}
    - {start: "11:15", end: "11:30", kind: break, label: "Break"}
    - {start: "11:30", end: "12:10", kind: module, slot: B, parts: [[briefing, 40]]}
    - {start: "12:10", end: "13:10", kind: lunch, label: "Lunch"}
    - {start: "13:10", end: "14:30", kind: module, slot: B, parts: [[lab, 70], [debrief, 10]]}
    - {start: "14:30", end: "14:45", kind: break, label: "Break"}
    - {start: "14:45", end: "16:45", kind: module, slot: C, parts: [[briefing, 40], [lab, 70], [debrief, 10]]}
    - {start: "16:45", end: "17:00", kind: wrapup, label: "Wrap-up and running results table"}
  capstone_parts: [[kickoff, 10], [work, 80], [share-outs, 30]]
  budgets:
    briefing_exposition_max: 30
    briefing_activity_min: 8
    lab_core_max: {A: 52, B: 54, C: 52}
    lab_reconnect_B: 3
    exercise_min: 5
    live_compute_max: 12

days:
  d1:
    n: 1
    title: From the Bellman equation to learning from experience
    question: What does "optimal" mean, and how do we find it, first with a model and then without one?
    framing: inventory control
    modules: [m01, m02, m03]
  d2:
    n: 2
    title: Exploration and bandits
    question: How should an agent gather data when every action costs something?
    framing: a recommender
    modules: [m04, m05, m06]
  d3:
    n: 3
    title: Value-based deep RL
    question: What changes when the value function is a neural network?
    framing: inventory at scale; "a teammate's DQN stopped learning"
    modules: [m07, m08, m09]
  d4:
    n: 4
    title: Policy optimization
    question: How do we improve a policy directly, and how far can we safely step?
    framing: pricing
    modules: [m10, m11, m12]
  d5:
    n: 5
    title: Learning from logged data
    question: Can we evaluate and improve a policy we never deployed?
    framing: shipping a recommender policy
    modules: [m13, m14, m15]

levels:
  100: Foundational
  200: Intermediate
  300: Advanced
  400: Expert

# Exact pins for what the notebooks add on Colab; everything else Colab already has is kept.
packages:
  checked: "2026-10-09"
  colab:
    backend_info_commit: e39694e267
    python: "3.13.16"
    use_preinstalled: [torch, numpy, scipy, pandas, matplotlib, transformers, accelerate, datasets]
    allow_upgrade: [gymnasium]
  pins:
    gymnasium: "1.4.0"
    stable-baselines3: "2.9.0"
    trl: "1.15.0"
    box2d: "2.3.10"
    mabwiser: "2.7.4"

models:
  smollm2:
    id: HuggingFaceTB/SmolLM2-135M-Instruct
    revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    license: Apache-2.0
    params: 134.5M

datasets: {}

runtimes:
  colab-cpu: {name: "Google Colab, CPU runtime", teaching: true, gpu: false}
  colab-t4: {name: "Google Colab, T4 GPU runtime", teaching: true, gpu: true}
  local: {name: "Your own machine (uv)", teaching: false, gpu: false}
  aws-g4dn: {name: "AWS g4dn.xlarge (T4)", teaching: false, gpu: true}
  ci: {name: "GitHub Actions runner (CPU)", teaching: false, gpu: false, ci: true}
  ci-proxy: {name: "GitHub Actions runner pinned to 2 cores", teaching: false, gpu: false, ci: true}

readiness:
  max_run_age_days: 21
  items:
    colab_smoke:
      title: "Human smoke run of 00-setup on a Colab CPU runtime (records vCPUs and throughput)"
      check: {record: {notebook: 00-setup, env: colab-cpu}}
    t4_dpo_smoke:
      title: "Human smoke run: one DPOTrainer step on a Colab T4 (ci/smoke/t4-dpotrainer-smoke.ipynb)"
      check: {record: {kind: experiment, experiment: t4-dpotrainer-smoke, env: colab-t4}}
    aws_e2e:
      title: "Human end-to-end run of the AWS path (create, connect, stop, start, destroy)"
      check: {manual: true, done: false}

modules:
  m00:
    n: 0
    slug: 00-setup
    day: 0
    slot: pre
    level: 100
    title: Setup and hello RL
    summary: Check your run path and run a random agent on CartPole with seed bands.
    question: Is my environment ready, and what does a baseline look like?
    where_we_are: Before Day 1.
    objectives:
      - Run the setup notebook on at least one run path and read its versions and runtime.
      - Plot returns of a random CartPole agent with seed bands.
      - Produce and submit a run record.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole notebook runs.
    scaffold: S3
    testbeds: [CartPole-v1]
    compared_with: {kind: truth, what: "CartPole-v1 return bounds [1, 500]"}
    planted_bug: null
    stretch: null
    minutes: 20
    exercises:
      # The explain_refs name the briefing's Gotchas; labs/src/00-setup.py's Explain cells cite
      # them verbatim (the build lints it).
      - n: 0
        title: Runtime check
        minutes: 5
        writes: []
        predict_answer: "No GPU on Colab's default runtime: the accelerator reads cpu. The CPU count is whatever the summary line shows (no Colab count is quoted without a record)."
        explain_ref: 'Gotcha: "A T4 speeds up CartPole."'
      - n: 1
        title: A random agent
        minutes: 5
        writes: [run_episode]
        predict_answer: "About 23: seat 0's 100 episodes averaged 22.64 (record 2026-10-10-local-00-setup-48b9f7d5, local); other seats differ. Exercise 1 prints a 20-episode mean, so expect a nearby number."
        explain_ref: 'Gotcha: "A random agent is no baseline."'
      - n: 2
        title: Seed bands
        minutes: 5
        writes: [returns_by_seed]
        predict_answer: "Not within 1 point. In record 2026-10-10-local-00-setup-48b9f7d5 (seat 0, local, not Colab) the five means ran from 19.9 to 27.65; read your own five printed means."
        explain_ref: 'Gotcha: "One seed is enough to compare."'
      - n: 3
        title: Your run record
        minutes: 5
        writes: []
        predict_answer: "platform (colab), env (colab-cpu or colab-t4), hardware.accel (cpu or cuda) and hardware.gpu"
        explain_ref: 'Gotcha: "The run record shares my name or keys."'
    status: {briefing: draft, lab: draft}

  m01:
    n: 1
    slug: 01-mdps-bellman
    day: 1
    slot: A
    level: 200
    title: MDPs, returns and the Bellman equation
    summary: Write an MDP as arrays, frame inventory control, and evaluate a policy exactly and by iteration.
    question: What quantity are we estimating, and why can we compute it exactly when the model is known?
    where_we_are: The start of the week.
    objectives:
      - Encode a finite MDP as arrays P[s,a,s'] and R[s,a] and validate it.
      - Frame inventory control as an MDP (state, action, reward, discount) and justify the choices.
      - Evaluate a policy exactly and iteratively, and bound the iteration count from the discount.
      - Find a wrong evaluator from its Bellman residual.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [CliffGridworld, InventoryMDP]
    compared_with: {kind: truth, what: "exact fixtures"}
    planted_bug: {what: "an evaluator that uses P_pi.T", diagnostic: "Bellman residual"}
    stretch: "The max-norm contraction holds; the 2-norm one can fail"
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 1
        title: Discounted return
        minutes: 5
        writes: [discounted_return]
        predict_answer: "2.71"
        explain_ref: 'Gotcha: "γ is a speed knob"'
      - n: 2
        title: A tiny cliff gridworld as arrays
        minutes: 8
        writes: [gridworld_arrays]
        predict_answer: "12 states; exactly one nonzero per row (deterministic moves)"
        explain_ref: 'Gotcha: "Rows or columns of P_π'
      - n: 3a
        title: Framing card for inventory
        minutes: 6
        writes: [inventory_spec, period_reward]
        predict_answer: "−3.60, negative: 4·4 − (5 + 2·7) − 0.2·3"
        explain_ref: 'Gotcha: "The reward is what I want."'
      - n: 3b
        title: The inventory MDP
        minutes: 9
        writes: [inventory_arrays]
        predict_answer: "every stock from 0 to 7 (7 on the shelf, demand 0 to 10)"
        explain_ref: "(matrix form)"
      - n: 4
        title: Exact evaluation
        minutes: 5
        writes: [evaluate_exact]
        predict_answer: "exactly 7 lower: both open with 7 units, and stock 6 pays 5 + 2 to order one"
        explain_ref: "(matrix form)"
      - n: 5
        title: Iterative evaluation and the contraction
        minutes: 10
        writes: [evaluate_iterative]
        predict_answer: "hundreds (140); about the same factor, near 10 (demo 116 → 1,198; shop 140 → 1,456)"
        explain_ref: "(iteration bound)"
      - n: 6
        title: "Planted bug: a wrong evaluator"
        minutes: 9
        writes: [bellman_residual, evaluate_suspect]
        predict_answer: "about 1e−14: the solve rounds, so not exactly 0"
        explain_ref: "(residual)"
    status: {briefing: reviewed, lab: reviewed}

  m02:
    n: 2
    slug: 02-planning
    day: 1
    slot: B
    level: 200
    title: "Planning: value iteration, policy iteration and model error"
    summary: Find the best policy with a model, then measure what an estimated model costs you.
    question: Given a model, how do we find the best policy, and what happens when the model is wrong?
    where_we_are: Module 1 evaluates a given policy.
    objectives:
      - Implement value iteration and policy iteration and compare their iteration counts.
      - Extract a greedy policy and check the greedy-loss bound.
      - Measure the true loss of a policy planned in an estimated model as the data shrinks, over 5 seeds.
      - State the simulation lemma with its assumptions and horizon factor, and check measured losses against its planning-loss bound.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [InventoryMDP, CliffGridworld]
    compared_with: {kind: truth, what: "exact fixtures"}
    planted_bug: {what: "value iteration stops on the mean change, not the max", diagnostic: "logged max |ΔV| per sweep and the optimality residual"}
    stretch: Modified policy iteration
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 0
        title: Reconnect and rerun setup
        minutes: 3
        writes: []
      - n: 1
        title: Value iteration and greedy extraction
        minutes: 12
        writes: [value_iteration, greedy]
        predict_answer: "Fill the shelf from stocks 0 to 3 and order nothing from stock 4 up: fewer, larger deliveries, because each costs a fixed 5. Value iteration takes 299 sweeps at tol 1e−6. Pace sheet for the Explain: V*(7) − V*(6) ≈ 2.54, not 7; at tol 1.0 (29 sweeps) the policy is already π*."
        explain_ref: "(greedy loss)"
      - n: 2
        title: Policy iteration
        minutes: 8
        writes: [policy_iteration]
        predict_answer: "About 4: from 'never order' the reference takes 4 evaluations (3 improvements) and returns the same policy as value iteration, which took 299 sweeps."
        explain_ref: 'Gotcha: "PI is always faster"'
      - n: 3
        title: Estimate the model
        minutes: 8
        writes: [estimate_model]
        predict_answer: "Usually more, and it varies by seat: seat 0 misses 38; seats 0–30 miss 20 to 38, and 30 of the 31 miss more than 23. Random orders do not visit stocks equally: a log spends many days at stock 0 and few at 9 and 10, so the missed pairs sit mostly at stocks 9 and 10 (at seat 0, 16 of the 38)."
        explain_ref: "(counts)"
      - n: 4
        title: Plan in the estimate, evaluate in the truth
        minutes: 13
        writes: [plan_and_evaluate, planning_loss_bound]
        predict_answer: "Not necessarily, and it varies by seat. Seat 0 (seeds 1000–1004): at N = 200 only one of five loses exactly 0 (the others lose 0.38 to 1.39), and the mean rises once, from 0.62 at N = 100 to 0.77 at N = 200. Across seats 0–25, 7 of 26 have all five seeds at exactly 0 at N = 200, and 13 of 26 have a mean that rises somewhere."
        explain_ref: "(planning loss)"
      - n: 5
        title: "Planted bug: a stopping rule"
        minutes: 9
        writes: [optimality_residual, value_iteration_suspect]
        predict_answer: "Never later, because the mean is at most the max. Shop: the same sweep, 299, so the shop cannot show the bug. Slippery cliff: earlier, 72 against 76, residual about 2× the guarantee. Mostly settled model: much earlier, 181 against 271, residual about 98× the guarantee."
        explain_ref: 'Gotcha: "Stop on the mean change"'
    status: {briefing: reviewed, lab: reviewed}

  m03:
    n: 3
    slug: 03-model-free
    day: 1
    slot: C
    level: 200
    title: Model-free prediction and control
    summary: Learn values and policies from experience with Monte Carlo, TD, SARSA and Q-learning.
    question: Without a model, how do we learn values and policies from experience?
    where_we_are: Module 2 needs P and R.
    objectives:
      - Measure the RMS error, squared bias and variance of MC and TD(0) estimates over 10 seeds against the exact V.
      - Implement SARSA and Q-learning and explain the cliff contrast under a constant epsilon.
      - Diagnose a terminal-bootstrap bug from the Q-values and a value curve, and say why the return curve does not show it.
      - Compute n-step TD targets and place them between MC and TD.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [CliffGridworld]
    compared_with: {kind: truth, what: "exact V and the optimal route"}
    planted_bug: {what: "Q-learning that bootstraps through the terminal state", diagnostic: "from an optimistic start, the last move's Q is -1 + gamma*Q0 instead of its reward and the value curve of the start flattens above V*; the return curve shows nothing"}
    stretch: An n-step sweep over n and alpha
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 1
        title: First-visit Monte Carlo prediction
        minutes: 9
        writes: [mc_prediction]
        predict_answer: "N: one per episode, from the first visit only, even when a fall brings the agent back; most likely lower: a clean 17-move episode has probability about 0.28 (a shorter one, about 3 × 10⁻¹⁷)"
        explain_ref: "(MC)"
      - n: 2a
        title: TD(0)
        minutes: 6
        writes: [td0_prediction]
        predict_answer: "both about −0.05 = α·(−1 + γ·0): every target was built from values still at 0 (a cell visited twice moves a little further); MC's estimate from the same episode is the whole return, −11.64 or lower"
        explain_ref: "(TD bias)"
      - n: 2b
        title: Bias² and variance over 10 seeds
        minutes: 5
        writes: [bias2_variance]
        predict_answer: "MC (1/N) has the lowest variance, by far: it averages about 1000 returns, while a constant α = 0.05 has the variance of an average of about (2 − α)/α ≈ 39; TD(0) has the largest bias²: the zero start, forgotten one bootstrap at a time"
        explain_ref: 'Gotcha: "TD is biased, so MC is better."'
      - n: 3
        title: The n-step target
        minutes: 6
        writes: [n_step_target]
        predict_answer: "−3.52 = −1 − 0.9 + 0.81·(−2); −1.9 = −1 − 0.9 (runs into the terminal, no bootstrap)"
        explain_ref: "(n-step)"
      - n: 4
        title: SARSA
        minutes: 8
        writes: [sarsa]
        predict_answer: "below −m: the agent still explores with ε = 0.1, so each non-greedy move adds steps, and at the start a random right falls (about 0.025 × 100 = 2.5 per episode)"
        explain_ref: "(SARSA)"
      - n: 5
        title: Q-learning and the cliff contrast
        minutes: 8
        writes: [q_learning]
        predict_answer: "about 30: 0.24/0.76 ≈ 0.32 falls per episode on the edge at about 100 each, less SARSA's 2 to 4 extra moves and its own falls at the start (about 2.5); the recorded lead is 23.8 to 31.1 over seeds 0–9 (runs/2026-10-17-local-m03-cliff-contrast-exp.json)"
        explain_ref: 'Gotcha: "Q-learning is better than SARSA."'
      - n: 6
        title: "Planted bug: bootstrapping through the terminal"
        minutes: 8
        writes: [q_learning_suspect]
        predict_answer: "−1, the move's reward (the next state is the goal, worth 0); no: every move costs at least 1, so no well-visited Q can settle above −1"
        explain_ref: "(terminal mask)"
    status: {briefing: reviewed, lab: reviewed}

  m04:
    n: 4
    slug: 04-bandits
    day: 2
    slot: A
    level: 200
    title: Bandits from first principles
    summary: Regret, UCB derived from Hoeffding's inequality, and Thompson sampling from Bayes' rule.
    question: Each pull earns reward and also reveals information. How should we choose?
    where_we_are: Module 3's epsilon-greedy explores blindly.
    objectives:
      - Define pseudo-regret from the known arm means and measure it with seed bands.
      - Derive the UCB1 bonus from Hoeffding's inequality, which assumes rewards in [0, 1], and implement it.
      - Implement Beta-Bernoulli Thompson sampling, which assumes rewards in {0, 1}, from Bayes' rule.
      - Show how epsilon-greedy and UCB1 depend on epsilon and on the reward scale, and explain why from their assumptions.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [Bernoulli bandits]
    compared_with: {kind: truth, what: "pseudo-regret from the known arm means"}
    planted_bug: {what: "a UCB1 agent whose counts never grow", diagnostic: "the histogram of pulls per arm: one arm takes every pull after the first round of each, and the bonus is the same for every arm"}
    stretch: Gaussian Thompson sampling
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet). Seat 0 is seeds
      # 1000-1019; "over 100 seats" is the record runs/2026-10-18-local-m04-seats-exp.json (seats 0-99,
      # 20 seeds each, the lab's own code at the live budget, arm64).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 1
        title: "Bandit loop, ε-greedy and regret"
        minutes: 11
        writes: [run_bandit, eps_greedy]
        predict_answer: "500.0 = 0.1 + 0.2 + 0 + 0.1 × 4997 (headline 0 from round 3 on); 999.7 = 0.3 + 0.2 × 4997 (headline 1); 0.3, the first three rounds only (headline 2). Seat 0's greedy ends at about 500 (499.5 to 500.4) or at 999.7 on the 9 of 20 seeds where it left headline 2 behind, and at 0.3 to 4.3 on the others. Over 100 seats it left headline 2 behind on 1121 of 2000 seeds, 5 to 17 per seat (runs/2026-10-18-local-m04-seats-exp.json)."
        explain_ref: "(pseudo-regret)"
      - n: 2
        title: UCB1
        minutes: 9
        writes: [ucb1_index]
        predict_answer: "About 200. The bound is 8 ln 5000 / 0.2² + 1 + π²/3 ≈ 1708; seat 0's UCB1 pulls headline 1 227 times on average (123 to 359 over 20 seeds), and the seat averages run from 216.6 to 273.0 over 100 seats (runs/2026-10-18-local-m04-seats-exp.json): the bound holds and is about 7 times too large."
        explain_ref: "(UCB1)"
      - n: 3
        title: Thompson sampling
        minutes: 8
        writes: [beta_posterior, thompson_step]
        predict_answer: "Less often: seat 0's Thompson sampling pulls headline 1 48 times on average (15 to 105), UCB1 227; the seat averages run from about 38 to 70 over 100 seats (runs/2026-10-18-local-m04-seats-exp.json). Less in the last 2500 rounds than in the first (seat 0: 41 and 6.5 on average), and seat 0 has 1 seed of 20 with no pull of headline 1 in the last 2500. The posterior never rules headline 1 out; its pulls only thin out."
        explain_ref: "(Thompson sampling)"
      - n: 4
        title: Three methods over 20 seeds
        minutes: 9
        writes: [verdict]
        predict_answer: "At 5000 rounds Thompson sampling < ε-greedy < UCB1: seat 0's IQMs 22.8, 53.2 and 103.7, every pair decided; over 100 seats Thompson sampling is lower than both on 100, and ε-greedy lower than UCB1 on 92 (a tie on 8). At 1000 rounds Thompson sampling vs ε-greedy is a tie (seat 0: 15.3 and 14.5; a tie on 99 of 100 seats), and UCB1 vs ε-greedy is a tie on 22 of 100. At 20 000 rounds UCB1 has the lower IQM: seat 0 175.1 against 206.5, a lead of 31.4; UCB1 lower on 82 of 100 seats, a tie on 18, ε-greedy never lower (runs/2026-10-18-local-m04-seats-exp.json). ε-greedy's floor adds 0.01 per round forever, while UCB1's pulls of a worse arm grow like ln t."
        explain_ref: 'Gotcha: "UCB1 has a logarithmic regret bound, so it beats ε-greedy."'
      - n: 5
        title: Reward scale and ε
        minutes: 8
        writes: [ucb1_for_range, scale_directions]
        predict_answer: "ε-greedy: same; UCB1 with ucb1_for_range at B = 10: same; UCB1 with the same bonus: changes. Its choices are greedier: on most seeds it pulls the worse headlines less and improves, and on some it falls into greedy's trap and gets far worse. Seat 0: mean 103.8 → 191.8, IQM 103.7 → 83.4, 13 of 20 seeds lower, and the tie rule calls a tie. Over 100 seats the mean rises on 97 and falls on 3, the IQM falls on 41, the tie rule calls a tie on 96, and 1174 of 2000 seeds improve. The sweep's lowest IQM is at ε = 0.05: seat 0 35.4 (200.9 at ε = 0, 252.4 at 0.5), and 77 of 100 seats (runs/2026-10-18-local-m04-seats-exp.json)."
        explain_ref: 'Gotcha: "UCB has no parameters."'
      - n: 6
        title: "Planted bug: a colleague's UCB1"
        minutes: 7
        writes: [UCB1Suspect]
        predict_answer: "√(2 ln 5000 / 4000) ≈ 0.065 and √(2 ln 5000 / 250) ≈ 0.261. Every headline is pulled: the best about 4000 times or more, the worse ones hundreds of times (seat 0, seed 1000: [591, 222, 4187]). The suspect prints a bonus of 4.13 for every arm, and one headline with 4998 pulls and the other two with 1 each, on every seed (all 2000 seeds of the 100-seat record, runs/2026-10-18-local-m04-seats-exp.json)."
        explain_ref: "(UCB1)"
    status: {briefing: reviewed, lab: reviewed}

  m05:
    n: 5
    slug: 05-contextual-bandits
    day: 2
    slot: B
    level: 200
    title: Contextual bandits for recommendation
    summary: Ridge regression, LinUCB and linear Thompson sampling on a recommender, and logging data you can learn from later.
    question: How do we explore when the best action depends on the context, and log data we can learn from later?
    where_we_are: Module 4 learns nothing across users.
    objectives:
      - Frame a recommender as a contextual bandit and say what is lost compared with full RL.
      - Implement incremental ridge regression, LinUCB and linear Thompson sampling.
      - Compare them with predict-then-greedy under misspecification and drift over 5 seeds.
      - Log data with correct propensities from a stochastic behavior policy.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [RecSim]
    compared_with: {kind: truth, what: "pseudo-regret from the simulator's known means; MABWiser parity in the stretch"}
    planted_bug: {what: "the logger records the greedy action's propensity", diagnostic: "mean importance weight differs from 1"}
    stretch: MABWiser parity
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet).
