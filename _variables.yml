  m06:
    n: 6
    slug: 06-exploration-mdps
    day: 2
    slot: C
    level: 300
    title: Exploration in MDPs
    summary: "How to explore when the reward is many steps away: hitting times, optimism and count bonuses on RiverSwim."
    question: How do we explore when the reward is many steps away?
    where_we_are: Bandit bonuses look one step ahead.
    objectives:
      - Compute RiverSwim's hitting time under uniform random play by first-step analysis, and find how it grows with the length of the chain.
      - Implement optimistic initialization and MBIE-EB's bonus inside the backup of an estimated model, and explain why the bonus belongs there.
      - Write cumulative regret against the DP optimum, and measure it and state visitation over 10 seeds, calling each comparison with its budget.
      - Explain where count bonuses stop working and what pseudo-counts and RND attempt.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S3
    testbeds: [RiverSwim]
    compared_with: {kind: truth, what: "the DP-optimal policy's expected rewards"}
    planted_bug: {what: "the bonus applied only at action selection", diagnostic: "state visitation piles up at the left end and never reaches the right end, and the plan values every unreached state at 0"}
    stretch: Posterior sampling for RL (PSRL)
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 1
        title: Uniform random play on RiverSwim
        minutes: 5
        writes: [policy_transition]
        predict_answer: "stay 0.475 = ½ · 0.95 (only the right action holds the right end, with 0.6 + 0.35); left 0.525 = ½ · 1 + ½ · 0.05"
        explain_ref: "(policy chain)"
      - n: 2
        title: Hitting time against chain length
        minutes: 9
        writes: [hitting_times]
        predict_answer: "about 936 · 3⁴ ≈ 75,800 (the solve gives 77,296.4): about 15 times the 5000-step budget"
        explain_ref: "(hitting time)"
      - n: 3
        title: "Epsilon-greedy and visitation"
        minutes: 7
        writes: [visitation]
        predict_answer: "more concentrated at the left end, and it never reaches the right end: once left has paid 0.005 at state 0, the greedy action there is left, and a right move needs an exploratory step (0.05 · 0.4 = 0.02 per step, against 0.2 under uniform play); on seeds 0–9 it spends 0.972–0.983 of its steps at state 0 and reaches the right end on none (runs/2026-10-18-local-m06-regret-seeds-exp-2.json)"
        explain_ref: 'Gotcha: "ε-greedy gets there eventually."'
      - n: 4
        title: Optimistic initialization
        minutes: 6
        writes: [optimistic_q0]
        predict_answer: "all 10, with the first visit within a few hundred to a thousand or so steps: every untried pair is worth 20, more than anything learned, so the agent tries right in each new state; on seeds 0–9 it reached the right end on 10 of 10, first at steps 399–1215 (runs/2026-10-18-local-m06-regret-seeds-exp-2.json)"
        explain_ref: "(optimistic start)"
      - n: 5
        title: The MBIE-EB backup
        minutes: 9
        writes: [mbie_eb_backup]
        predict_answer: "at the right end, over three quarters of the steps, close to the optimal policy's 0.852: every state with an untried action is worth at least c/(1 − γ) = 20 in the plan, so the agent swims right state by state, then holds the right end; on seeds 0–9 it spends 0.805–0.850 of its steps there (runs/2026-10-18-local-m06-regret-seeds-exp-2.json)"
        explain_ref: "(MBIE-EB backup)"
      - n: 6
        title: Cumulative regret over 10 seeds
        minutes: 8
        writes: [regret]
        predict_answer: "MBIE-EB lowest, then optimistic Q-learning, then ε-greedy, with no ties at 10 seeds: ε-greedy never leaves the left end, and optimistic Q-learning keeps revisiting states it already knows; on seeds 0–9 the IQMs are 133.2 [81.9, 171.9], 2611.9 [2513.6, 2672.9] and 4025.0 [4024.9, 4025.1] (runs/2026-10-18-local-m06-regret-seeds-exp-2.json)"
        explain_ref: "(regret)"
      - n: 7
        title: "Planted bug: a bonus in the wrong place"
        minutes: 8
        writes: [mbie_eb_suspect]
        predict_answer: "none at the right end, and more than half at the left end: the bonus only compares the two actions of the current state, and the plain plan values every unreached state at 0; on seeds 0–9 it never reaches the right end and spends 0.727–0.745 of its steps at state 0 (runs/2026-10-18-local-m06-regret-seeds-exp-2.json)"
        explain_ref: 'Gotcha: "Add the bonus when acting."'
    status: {briefing: reviewed, lab: reviewed}

  m07:
    n: 7
    slug: 07-function-approximation
    day: 3
    slot: A
    level: 300
    title: Function approximation and why it can diverge
    summary: Semi-gradient TD, the deadly triad on Baird's counterexample, and linear Q-learning on CartPole.
    question: What breaks when a parameterized function replaces the table?
    where_we_are: Tables do not scale.
    objectives:
      - Derive semi-gradient TD(0) for linear values and show that its expected update is not the gradient of any objective.
      - Reproduce Baird's divergence with expected updates, and show what removing each leg of the deadly triad does to convergence and to the limit.
      - Frame inventory at scale and justify a feature representation.
      - Train linear semi-gradient Q-learning on CartPole and report the weight norm and returns.
    runtime: colab-cpu
    cost: Free (Google account)
    without_gpu: The whole lab runs.
    scaffold: S2
    testbeds: [Baird, CartPole-v1, InventoryMDP]
    compared_with: {kind: band, what: "a recorded multi-seed band of the same linear Q-learning at the same budget"}
    planted_bug: {what: "features not scaled to unit length (each bump in [0, 1], but the squared length near 10)", diagnostic: "the weight-norm log: ‖W‖ is orders of magnitude above the healthy run's from the first entry and keeps climbing; the greedy return may or may not collapse"}
    stretch: TDC on Baird
    exercises:
      # predict_answer: the answer to the Predict prompt (for the pace sheet). "Exact" numbers are
      # deterministic computations of the lab's code (no sampling), asserted by
      # scripts/make_figures_m07.py. CartPole numbers come from the band records
      # runs/2026-10-24-local-m07-linear-q-{live,quick}-exp.json (seeds 0-19, arm64; seats use
      # (SEED + 1) * 1000, so a seat's run differs).
      # explain_ref: the equation name or Gotcha the Explain prompt cites, verbatim (linted).
      - n: 1
        title: Frame inventory at scale
        minutes: 5
        writes: [scale_spec]
        predict_answer: "Between 1 and 5: the largest error is 2.47 against the fee of 5, on values from 50.91 to 75.91. With independent products it is below 1e-12, rounding (exact computations). The fit absorbs the part of the saving that each product's own stock explains; what is left depends on the pair. A feature that depends on both stocks at once (an interaction) is missing. For the three-product shop the run prints 132,651 states, 132,651 orders, 17,596,287,801 Q entries (141 GB in float64) and 153 one-hot features."
        explain_ref: "(one-hot features)"
      - n: 2
        title: The semi-gradient TD(0) update
        minutes: 7
        writes: [semi_gradient_td0]
        predict_answer: "δ = 0 + 0.99 · 12 − 3 = 8.88. The step is 0.01 · 8.88 · φ(1) = 0.0888 · φ(1), so w₁ = 1.1776 and w₈ = 1.0888, and v̂(1) = 3 + 0.0888 · ‖φ(1)‖² = 3 + 0.0888 · 5 = 3.444. v̂(7) moves up too, to 12.1776, because weight 8 is shared; the transition's TD error falls only to 8.6118 (exact)."
        explain_ref: "(semi-gradient TD(0))"
      - n: 3
        title: Why it is not a gradient
        minutes: 6
        writes: [td_matrix]
        predict_answer: "A[1, 7] = μ(1) · φ₁(1) · (0 − γ · 1) = (1/7) · 2 · (−0.99) = −1.98/7 = −0.28286; A[7, 1] = μ(7) · φ₇(7) · (φ₁(7) − γ φ₁(7)) = 0, since φ₁(7) = 0 (exact). So A is not symmetric: the largest |A − Aᵀ| is 0.8486. The real parts of A's eigenvalues are −0.23925, −0.02218, 0 and 0.57143 (five times)."
        explain_ref: 'Gotcha: "Semi-gradient TD is gradient descent."'
      - n: 4
        title: "Baird's counterexample"
        minutes: 8
        writes: [baird_expected_update]
        predict_answer: "Above 100: ‖w‖ = 10.344 at the start, 10.609 after 10 sweeps, 16.826 after 100 and 436.856 after 1000 (exact). Each upper state's target, 0.99 · v̂(7), starts above its value, so w₁ to w₆ and w₈ rise; state 7's target, 0.99 · v̂(7), is below its own value, so w₇ falls from 10 to 6.85. w₁ to w₆ end at 114.43 and w₈ at 335.00. A smaller α changes only the speed: the fastest direction grows by 1 + 0.23925 α per sweep (1.000239, 1.002393 and 1.023925 at α = 0.001, 0.01 and 0.1). Facilitator note: 1.002393^1000 ≈ 10.9 predicts about 113, but ‖w‖ grows 42-fold, because w₀'s component along the growing unit eigenvector has size 44.9, more than ‖w₀‖ itself: A is not symmetric and its eigenvectors are far from orthogonal (exact). Both routes give 'above 100'."
        explain_ref: 'Gotcha: "A bigger network will fix divergence."'
      - n: 5
        title: Remove one leg of the triad
        minutes: 10
        writes: [remove_one_leg]
        predict_answer: "Only the tabular variant reaches w = 0, and it is the slowest. On-policy: A = (1 − γ)φ₇φ₇ᵀ changes only the component of w along φ₇, so v̂(7) → 0 while the six upper states stay at −1.8, and w → (1, 1, 1, 1, 1, 1, 7.6, −3.8). Monte Carlo: every value reaches 0 (largest error 2e-12 after 10^4 sweeps) while w → (22/13)(1, 1, 1, 1, 1, 1, 4, −2) ≈ (1.692, …, 6.769, −3.385), the part of w₀ that Φ maps to 0. Tabular: values 7.5e-6 after 10^6 sweeps and still falling; its slowest direction shrinks by a factor 1 − α(1 − γ)/7 = 1 − 1.43e-5 per sweep. The original's largest error is 1.6e12 after 10^4 sweeps (all exact)."
        explain_ref: "(TD matrix)"
      - n: 6
        title: Linear Q-learning on CartPole
        minutes: 8
        writes: [linear_q_update]
        predict_answer: "Far above 3 × random. Over seeds 0-19 of the live band record the greedy return runs from 206.6 to 500 (median 493.5) against random play's 12.2 to 29.0 (median 22.0) on the same start states, at least 8.1 times random on every seed; at the QUICK budget 214.9 to 500 (median 348.4). ‖W‖ rises to a peak of 327 to 420 and settles a little below it, 263 to 312 at the end (QUICK: peaks 172 to 193). Records: runs/2026-10-24-local-m07-linear-q-live-exp.json and -quick-exp.json."
        explain_ref: "(linear Q-learning)"
      - n: 7
        title: "Planted bug: a colleague's featurizer"
        minutes: 7
        writes: [colleague_features]
        predict_answer: "Growing by many orders of magnitude, already at the first log entry. Facilitator facts: ‖φ(s)‖² = 9.868 at the upright state (exact), so α ‖φ(s)‖² = 2.960 and one update multiplies a fixed-target error by 1 − 2.960 = −1.960. Over seeds 0-19 of the live band record the largest ‖W‖ is 10^85.6 to 10^115.4 (QUICK budget: 10^32.1 to 10^52.8), never inf or nan within the budget; |Q| at the start state exceeds 1000 on every seed, far above 1/(1 − γ) = 100. The greedy return runs from 9.2 to 459.3 (median 14.4) and is above 160 on seeds 3, 4 and 12: the return alone does not reveal the bug. Records: runs/2026-10-24-local-m07-linear-q-live-exp.json and -quick-exp.json."
        explain_ref: 'Gotcha: "Features are just preprocessing."'
    status: {briefing: draft, lab: draft}

