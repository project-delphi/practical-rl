      - n: 0
        title: Reconnect and rerun setup
        minutes: 3
        writes: []
      - n: 1
        title: Frame the recommender
        minutes: 5
        writes: [reward_fn]
        predict_answer: "About 500 each (seat 0: 486 and 464; runs/2026-10-18-local-m05-seats-exp.json). x is drawn from N(0, I/5), which is symmetric about 0, and the clip is symmetric about 0.5, so in the well-specified regime every item's click probability averaged over users is exactly 0.5. Module 4's bandit would see ten equal means, and no item it could pick earns more than showing items at random. Which item is best depends only on the user (the run cell counts how often each item is best)."
        explain_ref: 'Gotcha: "Every recommender is a contextual bandit."'
      - n: 2
        title: Incremental ridge regression
        minutes: 8
        writes: [Ridge]
        predict_answer: "0.9 = n/(n + λ_ridge) with n = 9 and λ_ridge = 1: the penalty λ_ridge I acts like λ_ridge extra observations with reward 0 in every direction, and its pull fades as n grows."
        explain_ref: "(Sherman–Morrison)"
      - n: 3
        title: LinUCB
        minutes: 10
        writes: [linucb_scores]
        predict_answer: "Width 1/√101 ≈ 0.0995; bonus c/√101 ≈ 0.050 at c = 0.5: for a unit φ, φᵀ(I + n φφᵀ)⁻¹φ = 1/(1 + n) by Sherman–Morrison. Pace sheet for the Explain: at seat 0, greedy showed four items only at the launch (items 2, 4, 7 and 9, once each; m05-seats)."
        explain_ref: "(width)"
      - n: 4
        title: Linear Thompson sampling
        minutes: 6
        writes: [lints_sample]
        predict_answer: "About 1 draw in 44: P(Z > c/v) = P(Z > 2) ≈ 0.0228, whatever the item and the user (seat 0: 447 of 20000 draws; m05-seats)."
        explain_ref: "(LinTS)"
      - n: 5
        title: Three regimes and a warm launch
        minutes: 10
        writes: [verdicts]
        predict_answer: "(1) No: at every seat, both methods' IQM regret is below greedy's in all three regimes (seats 0–29, m05-seats). (2) Smaller under drift, at 27 of 30 seats. (3) It shrinks, and at five seeds the call usually vanishes: the well-specified LinUCB call is a tie at 29 of 30 seats with three passes, against 12 of 30 with one, and the median lead falls from 121.7 to 38.3; at 2 of the 30 seats LinUCB's IQM is even above greedy's, within a tie (runs/2026-10-18-local-m05-launch-exp.json). The tie count varies by seat: with one pass, LinUCB's calls are ties at 12, 5 and 21 of 30 seats (well-specified, misspecified, drifting). Seat 0: LinUCB beats greedy well-specified and misspecified and ties under drift and after the warm launch; LinTS ties in all four."
