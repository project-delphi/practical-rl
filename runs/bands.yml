    quick: 2026-10-24-local-m08-ddqn-quick-exp
m08_ddqn_q0:
  metric: >-
    Q(s0) = max_a Q(s0, a; w) at the 10 evaluation start states (mean) of Double DQN (Lab 8's train_dqn with CONFIG and double_dqn_target), against environment steps
  x: budget.grid
  runs: per_seed.q0
  budget: [steps, eval_every]
  records:
    live: 2026-10-24-local-m08-ddqn-live-exp
    quick: 2026-10-24-local-m08-ddqn-quick-exp
m08_ddqn_mc:
  metric: >-
    Discounted return G_0 (gamma = 0.99) of the greedy policy from the 10 evaluation start states (mean) of Double DQN (Lab 8's train_dqn with CONFIG and double_dqn_target), against environment steps
  x: budget.grid
