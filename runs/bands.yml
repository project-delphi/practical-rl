# Recorded bands that ship inside prl (prl/src/prl/datasets/bands/), read in labs with
# prl.data.band(name, settings). scripts/export_bands.py copies each band from the experiment
# records named here; its --check (CI's drift gate) fails when a band is out of date with its
# record or with this file. Edit this file and the records, never the exported files.
#
# One entry per band, with one record per budget the lab runs at (live and quick):
#
# m08_return:                        # the name labs pass to prl.data.band
#   metric: >-                       # what each curve holds, with units
#     Greedy-policy return (mean of 10 evaluation episodes) against environment steps
#   x: budget.grid                   # dotted path (or list of keys) in the record: the grid,
#                                    # a strictly increasing list of numbers
#   runs: per_seed.return            # one curve per seed, indexed like the record's `seeds`,
#                                    # each as long as x; finite numbers; at least 3 seeds
#   budget: [steps, log_every]       # keys of the record's `budget` that make runs comparable.
#                                    # They must use the names and values of the lab's
#                                    # prl.runtime.settings(...): band() and with_recorded()
#                                    # match them against the lab's settings.
#   records:                         # budget label -> record id (file name in runs/, no .json)
#     live: 2026-10-26-local-m08-bands-live-exp
#     quick: 2026-10-26-local-m08-bands-quick-exp
#
# Each band also carries where and how long its record ran, for the budget sentence (steps,
# seeds, wall-clock, hardware) on Colab: the record's platform, env, hardware (cpu, n_cpu,
# accel, gpu), torch_threads, its total `seconds` and, if the record holds one number per seed
# in per_seed.seconds, those too (None when absent). A laptop time stays a laptop time.
#
# Then run: uv run python scripts/export_bands.py

m07_linear_q:
  metric: >-
    Mean return of the last 10 finished training episodes, every 1000 environment steps
    (linear semi-gradient Q-learning on CartPole-v1 with 625 unit-length RBF features,
    alpha 0.3, gamma 0.99, epsilon from 1 to 0.05 over eps_steps)
  x: budget.grid
  runs: per_seed.recent_return
  budget: [steps, eps_steps, log_every]
  records:
    live: 2026-10-24-local-m07-linear-q-live-exp
    quick: 2026-10-24-local-m07-linear-q-quick-exp
# Module 8 (Lab 8 reads all seven at both budgets; seeds 0-4).
m08_dqn_return:
  metric: >-
    Greedy-policy return (undiscounted, mean of 10 evaluation episodes from fixed start states) of the reference DQN (Lab 8's train_dqn with CONFIG), against environment steps
  x: budget.grid
  runs: per_seed.return
  budget: [steps, eval_every]
  records:
    live: 2026-10-24-local-m08-dqn-live-exp
    quick: 2026-10-24-local-m08-dqn-quick-exp
m08_dqn_q0:
  metric: >-
    Q(s0) = max_a Q(s0, a; w) at the 10 evaluation start states (mean) of the reference DQN (Lab 8's train_dqn with CONFIG), against environment steps
  x: budget.grid
  runs: per_seed.q0
  budget: [steps, eval_every]
  records:
    live: 2026-10-24-local-m08-dqn-live-exp
    quick: 2026-10-24-local-m08-dqn-quick-exp
m08_dqn_mc:
  metric: >-
    Discounted return G_0 (gamma = 0.99) of the greedy policy from the 10 evaluation start states (mean) of the reference DQN (Lab 8's train_dqn with CONFIG), against environment steps
  x: budget.grid
  runs: per_seed.disc_return
  budget: [steps, eval_every]
  records:
    live: 2026-10-24-local-m08-dqn-live-exp
    quick: 2026-10-24-local-m08-dqn-quick-exp
m08_ddqn_return:
  metric: >-
